name: Deploy MSUO License Manager (IONOS Windows)
# Deployment re-trigger after repository credential provisioning
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'license-manager/**'
      - '.github/workflows/deploy-license-manager.yml'
permissions:
  contents: read
concurrency:
  group: msuo-license-manager
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish .NET application
        shell: powershell
        run: |
          dotnet --info
          dotnet publish .\license-manager\MSUO.LicenseManager.csproj -c Release -o "$env:RUNNER_TEMP\msuo-license-publish"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
      - name: Provision license credentials on IONOS server
        shell: powershell
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MSUO_SIGNING_PRIVATE_KEY: ${{ secrets.MSUO_SIGNING_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          foreach ($name in @('FIREBASE_SERVICE_ACCOUNT_JSON','MSUO_SIGNING_PRIVATE_KEY','RESEND_API_KEY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub Actions repository secret: $name"
            }
          }
          $dir = 'C:\MSUO\Secrets'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $dir 'firebase-service-account.json'), $env:FIREBASE_SERVICE_ACCOUNT_JSON, (New-Object System.Text.UTF8Encoding($false)))
          [System.IO.File]::WriteAllText((Join-Path $dir 'MSUO_signing_private.pem'), $env:MSUO_SIGNING_PRIVATE_KEY, (New-Object System.Text.UTF8Encoding($false)))
          $resend = @{ 'Mail-Service' = @{ Provider = 'Resend'; Token = $env:RESEND_API_KEY }; From = 'MSUO Application Orchestration Kernel <license@msuo-runtime.io>' }
          [System.IO.File]::WriteAllText((Join-Path $dir 'resend.json'), ($resend | ConvertTo-Json -Depth 4), (New-Object System.Text.UTF8Encoding($false)))
          $account = Get-Content (Join-Path $dir 'firebase-service-account.json') -Raw | ConvertFrom-Json
          if ($account.project_id -ne 'msuo-community-licensemanager') { throw 'Firebase project ID mismatch' }
          if ($env:MSUO_SIGNING_PRIVATE_KEY -notmatch 'BEGIN (RSA )?PRIVATE KEY') { throw 'Invalid MSUO signing key format' }
      - name: Test ASP.NET startup directly on runner
        shell: powershell
        run: |
          $env:GOOGLE_APPLICATION_CREDENTIALS = 'C:\MSUO\Secrets\firebase-service-account.json'
          $env:SIGNING_PRIVATE_KEY_PATH = 'C:\MSUO\Secrets\MSUO_signing_private.pem'
          $resend = Get-Content 'C:\MSUO\Secrets\resend.json' -Raw | ConvertFrom-Json
          $env:RESEND_API_KEY = $resend.'Mail-Service'.Token
          $env:RESEND_FROM = $resend.From
          $env:FIREBASE_PROJECT_ID = 'msuo-community-licensemanager'
          $env:BIND_URL = 'http://127.0.0.1:5108'
          $env:DISABLE_MAIL_WORKER = 'true'
          $dll = Join-Path $env:RUNNER_TEMP 'msuo-license-publish\MSUO.LicenseManager.dll'
          $logOut = Join-Path $env:RUNNER_TEMP 'license-direct.stdout.log'
          $logErr = Join-Path $env:RUNNER_TEMP 'license-direct.stderr.log'
          $process = Start-Process -FilePath 'dotnet.exe' -ArgumentList ('"' + $dll + '"') -WorkingDirectory (Split-Path $dll) -PassThru -WindowStyle Hidden -RedirectStandardOutput $logOut -RedirectStandardError $logErr
          try {
            Start-Sleep -Seconds 7
            if ($process.HasExited) { throw "Direct startup process exited: $($process.ExitCode)" }
            Write-Host 'Direct stdout:'
            if (Test-Path $logOut) { Get-Content $logOut -Tail 35 }
            Write-Host 'Direct stderr:'
            if (Test-Path $logErr) { Get-Content $logErr -Tail 35 }
            $response = Invoke-WebRequest 'http://127.0.0.1:5108/health' -UseBasicParsing -TimeoutSec 5
            if ($response.StatusCode -ne 200) { throw 'Direct ASP.NET health check failed' }
            $eula = Invoke-RestMethod 'http://127.0.0.1:5108/api/eula' -TimeoutSec 5
            if ($eula.version -ne '1.0' -or !$eula.sha256 -or !$eula.text) { throw 'EULA preflight failed' }
            $pdf = Invoke-WebRequest 'http://127.0.0.1:5108/eula/1.0/MSUO-EULA.pdf' -UseBasicParsing -TimeoutSec 5
            if ($pdf.StatusCode -ne 200) { throw 'EULA PDF preflight failed' }
            Write-Host 'Direct application health and EULA checks passed'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Deploy and install startup task
        shell: powershell
        run: |
          $target = 'C:\MSUO\LicenseManager'
          New-Item -Force -ItemType Directory $target | Out-Null
          $old = Get-ScheduledTask -TaskName 'MSUO-LicenseManager' -ErrorAction SilentlyContinue
          if ($old) { Stop-ScheduledTask -TaskName 'MSUO-LicenseManager' -ErrorAction SilentlyContinue }
          Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'dotnet.exe' -and $_.CommandLine -like '*MSUO.LicenseManager.dll*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Copy-Item "$env:RUNNER_TEMP\msuo-license-publish\*" $target -Recurse -Force
          $launcher = @'
          $env:GOOGLE_APPLICATION_CREDENTIALS = 'C:\MSUO\Secrets\firebase-service-account.json'
          $env:SIGNING_PRIVATE_KEY_PATH = 'C:\MSUO\Secrets\MSUO_signing_private.pem'
          $resend = Get-Content 'C:\MSUO\Secrets\resend.json' -Raw | ConvertFrom-Json
          $env:RESEND_API_KEY = $resend.'Mail-Service'.Token
          $env:RESEND_FROM = $resend.From
          $env:FIREBASE_PROJECT_ID = 'msuo-community-licensemanager'
          $env:BIND_URL = 'http://127.0.0.1:5107'
          Set-Location 'C:\MSUO\LicenseManager'
          & dotnet 'C:\MSUO\LicenseManager\MSUO.LicenseManager.dll' *> 'C:\MSUO\LicenseManager\startup.log'
          '@
          Set-Content -Path "$target\start.ps1" -Value $launcher -Encoding UTF8
          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$target\start.ps1`""
          $trigger = New-ScheduledTaskTrigger -AtStartup
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Seconds 0) -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1)
          Register-ScheduledTask -TaskName 'MSUO-LicenseManager' -Action $action -Trigger $trigger -Settings $settings -User 'SYSTEM' -RunLevel Highest -Force | Out-Null
          # Start a detached process independent of the GitHub runner process group.
          # RUNNER_TRACKING_ID is what the runner uses to terminate orphan processes after jobs.
          $previousTrackingId = $env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID = ''
          $proc = Start-Process -FilePath 'powershell.exe' -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$target\start.ps1`"" -PassThru -WindowStyle Hidden
          $env:RUNNER_TRACKING_ID = $previousTrackingId
          Write-Host "Detached launcher PID: $($proc.Id)"
          $healthy = $false
          for ($i=0; $i -lt 12; $i++) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-WebRequest 'http://127.0.0.1:5107/health' -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $healthy = $true; break }
            } catch { }
          }
          if ($healthy) {
            $eula = Invoke-RestMethod 'http://127.0.0.1:5107/api/eula' -TimeoutSec 5
            if ($eula.version -ne '1.0' -or !$eula.sha256) { throw 'Deployed EULA check failed' }
          }
          if (-not $healthy) {
            Write-Host "License Manager failed to answer /health"
            Get-ScheduledTaskInfo -TaskName 'MSUO-LicenseManager' | Format-List *
            Get-Content "$target\start.ps1" -ErrorAction SilentlyContinue | Select-Object -First 12
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*MSUO.LicenseManager*' } | Select-Object ProcessId,Name,CommandLine | Format-Table -AutoSize
            if (Test-Path "$target\startup.log") {
              Get-Content "$target\startup.log" -Tail 60
            } else { Write-Host "No startup log created" }
            throw "MSUO License Manager health check failed"
          }
