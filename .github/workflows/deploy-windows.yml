name: Deploy MSUO Observatory (Windows)

# First deployment is deliberately manual. After the runner and service are
# verified, push-to-main deployment can be enabled safely.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msuo-observatory-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy on IONOS Windows Server
    runs-on: [self-hosted, Windows, X64, msuo-observatory]
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Python 3.10+
        shell: powershell
        run: |
          py -3 -c "import sys; assert sys.version_info >= (3, 10), 'Python 3.10+ required'; print(sys.version)"

      - name: Run parser tests
        shell: powershell
        run: |
          py -3 -m unittest discover -s tests -v

      - name: Deploy and restart Observatory
        shell: powershell
        env:
          MSUO_DEPLOY_DIR: ${{ vars.MSUO_DEPLOY_DIR }}
        run: |
          $target = $env:MSUO_DEPLOY_DIR
          if ([string]::IsNullOrWhiteSpace($target)) {
            $target = 'C:\MSUO\Observatory'
          }
          & .\scripts\deploy_windows.ps1 -Destination $target
