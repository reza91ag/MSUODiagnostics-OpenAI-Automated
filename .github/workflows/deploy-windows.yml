name: Deploy MSUO Observatory (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'web/**'
      - 'tests/**'
      - 'sample_logs/**'
      - 'scripts/**'
      - '.github/workflows/deploy-windows.yml'

permissions:
  contents: read

concurrency:
  group: msuo-observatory-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy on IONOS Windows Server
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Python 3.10+
        shell: powershell
        run: |
          py -3 -c "import sys; assert sys.version_info >= (3, 10), 'Python 3.10+ required'; print(sys.version)"

      - name: Run parser tests
        shell: powershell
        run: |
          py -3 -m unittest discover -s tests -v

      - name: Register Observatory startup task if missing
        shell: powershell
        env:
          MSUO_DEPLOY_DIR: ${{ vars.MSUO_DEPLOY_DIR }}
        run: |
          $target = $env:MSUO_DEPLOY_DIR
          if ([string]::IsNullOrWhiteSpace($target)) {
            $target = 'C:\MSUO\Observatory'
          }
          if (-not (Get-ScheduledTask -TaskName 'MSUO-Observatory' -ErrorAction SilentlyContinue)) {
            & .\scripts\setup_windows_task.ps1 -Destination $target
          }

      - name: Deploy and restart Observatory
        shell: powershell
        env:
          MSUO_DEPLOY_DIR: ${{ vars.MSUO_DEPLOY_DIR }}
        run: |
          $target = $env:MSUO_DEPLOY_DIR
          if ([string]::IsNullOrWhiteSpace($target)) {
            $target = 'C:\MSUO\Observatory'
          }
          & .\scripts\deploy_windows.ps1 -Destination $target
