name: Diagnose License Email Delivery
# Verify public PNG logo delivery after CID removal
# Verify registration endpoint from IONOS runner
# Trigger post-validation diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-license-mail.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect license service and delivery errors
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $logoUrl = 'https://license.msuo-runtime.io/msuo-email-logo.png'
            $logo = Invoke-WebRequest $logoUrl -UseBasicParsing -TimeoutSec 12
            $bytes = $logo.RawContentStream.ToArray()
            $isPng = $bytes.Length -gt 8 -and $bytes[0] -eq 137 -and $bytes[1] -eq 80 -and $bytes[2] -eq 78 -and $bytes[3] -eq 71
            Write-Host "Public MSUO PNG status: $($logo.StatusCode) Content-Type: $($logo.Headers['Content-Type']) Bytes: $($bytes.Length) PNG signature: $isPng"
            if ($logo.StatusCode -ne 200 -or !$isPng) { throw 'Public PNG logo validation failed' }
          } catch { Write-Host "Public MSUO PNG verification FAILED: $($_.Exception.Message)"; throw }
          $url = 'http://127.0.0.1:5107/health'
          try {
            $r = Invoke-WebRequest 'http://127.0.0.1:5107/api/register' -Method Post -ContentType 'application/json' -Body '{"email":"not-an-email"}' -UseBasicParsing -TimeoutSec 15
            Write-Host "Local registration probe HTTP: $($r.StatusCode)"
          } catch {
            $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 'no HTTP response' }
            Write-Host "Local registration probe status: $status"
            Write-Host "Local probe exception: $($_.Exception.GetType().Name)"
          }
          try {
            $r = Invoke-WebRequest 'https://license.msuo-runtime.io/health' -UseBasicParsing -TimeoutSec 12
            Write-Host "Public license health: $($r.StatusCode)"
          } catch { Write-Host "Public license health error: $($_.Exception.Message)" }
          try { $r = Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 5; Write-Host "Health HTTP: $($r.StatusCode)" }
          catch { Write-Host "Health failed: $($_.Exception.Message)" }
          $task = Get-ScheduledTask -TaskName 'MSUO-LicenseManager' -ErrorAction SilentlyContinue
          if ($task) { Write-Host "Task state: $($task.State)" }
          $log = 'C:\MSUO\LicenseManager\startup.log'
          if (!(Test-Path $log)) { Write-Host "No startup log at $log"; exit 0 }
          $lines = Get-Content $log -Tail 350
          Write-Host 'Filtered app diagnostics:'
          $lines | Where-Object { $_ -match 'fail|error|warn|permission|firestore|grpc|Resend|HttpRequestException|Unauthorized|Forbidden|InvalidOperation|Exception|StatusCode|403|401|422|429|quota|deadline|Unavailable|credentials|service started' } |
            ForEach-Object {
              $line = $_ -replace '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[email-redacted]'
              $line = $line -replace 're_[A-Za-z0-9_\-]+', '[token-redacted]'
              $line = $line -replace 'MSUO1\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+', '[license-redacted]'
              Write-Host $line
            } | Select-Object -Last 90
