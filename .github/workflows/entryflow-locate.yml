name: Locate EntryFlow frontend (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/entryflow-locate.yml'
permissions:
  contents: read
jobs:
  locate:
    runs-on: [self-hosted, windows]
    environment: production
    timeout-minutes: 4
    steps:
      - name: Find the compiled EntryFlow build on fixed disks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '35f6a7317aab9d74e3165955f9d92de4fb61b89e14bf116d5760582c79764d09'
          $dirs = [Collections.Generic.Stack[string]]::new()
          $stop = (Get-Date).AddSeconds(100)
          foreach ($disk in Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3') {
              $dirs.Push($disk.DeviceID + '\')
          }
          $count = 0
          while ($dirs.Count -gt 0 -and (Get-Date) -lt $stop) {
              $dir = $dirs.Pop()
              $file = Join-Path $dir 'main.dart.js'
              $f = Get-Item -LiteralPath $file -ErrorAction SilentlyContinue
              if ($f -and $f.Length -eq 3029545 -and (Test-Path -LiteralPath (Join-Path $dir 'index.html') -PathType Leaf)) {
                  if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -eq $expected) {
                      Write-Host "Matching frontend: $dir"
                      $count++
                  }
              }
              foreach ($child in Get-ChildItem -LiteralPath $dir -Directory -Force -ErrorAction SilentlyContinue) {
                  if ($child.Name -match '^(Windows|WinSxS|Program Files( \(x86\))?|ProgramData|AppData|actions-runner|node_modules|\.git|\.dart_tool|System Volume Information|\$Recycle\.Bin)$' -or $child.Name -match '(?i)backup' -or ($child.Attributes -band [IO.FileAttributes]::ReparsePoint)) { continue }
                  $dirs.Push($child.FullName)
              }
          }
          Write-Host "Matches: $count; scan completed: $($dirs.Count -eq 0)"
