name: Browser QA
run-name: ${{ inputs.continuous && 'Browser QA continuous' || 'Browser QA' }}

on:
  workflow_dispatch:
    inputs:
      continuous:
        description: Keep queuing the full cycle until the workflow is disabled
        type: boolean
        default: false
      optispec_pending:
        description: Synthetic device IDs carried from the previous cycle
        type: string
        required: false
      pdf_only:
        description: Check the PDF download without creating a record
        type: boolean
        default: false
      recover_entry_id:
        description: 'Optional synthetic EntryFlow record ID for cleanup only'
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-qa.yml'
      - 'browser-qa/**'
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: read

jobs:
  plan:
    name: Check whether a continuous run is already active
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      start: ${{ steps.guard.outputs.start }}
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/browser-qa.yml/runs?event=workflow_dispatch&per_page=20" --jq '
            [.workflow_runs[] | select(.display_title == "Browser QA continuous" and .status != "completed")] | length')
          if [[ "$active" == 0 ]]; then
            echo 'start=true' >> "$GITHUB_OUTPUT"
          fi

  smoke:
    needs: plan
    if: always() && !cancelled() && (github.event_name != 'schedule' || needs.plan.outputs.start == 'true')
    name: ${{ matrix.app }} smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      entryflow_windows: ${{ steps.entryflow.outputs.dashboard_windows }}
      optispec_windows: ${{ steps.optispec.outputs.dashboard_windows }}
      optispec_added: ${{ steps.optispec.outputs.optispec_added }}
      optispec_removed: ${{ steps.optispec.outputs.optispec_removed }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(github.event_name == 'push' && github.event.head_commit.message == 'Verify OptiSpec device removal end to end' && '["optispec"]' || '["entryflow","optispec"]') }}
    concurrency:
      group: browser-qa-${{ matrix.app }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: browser-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Run EntryFlow smoke test
        id: entryflow
        if: matrix.app == 'entryflow'
        env:
          MSUO_QA_EMAIL: ${{ secrets.ENTRYFLOW_QA_EMAIL }}
          MSUO_QA_PASSWORD: ${{ secrets.ENTRYFLOW_QA_PASSWORD }}
          QA_PDF_ONLY: ${{ (github.event_name == 'push' && github.event.head_commit.message != 'Verify synthetic add and remove through the dashboard' && github.event.head_commit.message != 'Start continuous Browser QA' && github.event.head_commit.message != 'Verify OptiSpec device removal end to end') || inputs.pdf_only }}
          RECOVERY_INPUT: ${{ inputs.recover_entry_id }}
          PUSH_MESSAGE: ${{ github.event_name == 'push' && github.event.head_commit.message || '' }}
        run: |
          missing=()
          [[ -n "$MSUO_QA_EMAIL" ]] || missing+=("ENTRYFLOW_QA_EMAIL")
          [[ -n "$MSUO_QA_PASSWORD" ]] || missing+=("ENTRYFLOW_QA_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=QA credentials unavailable::GitHub Actions did not supply ${missing[*]}"
            exit 1
          fi
          export QA_RECOVERY_ENTRY_ID="$RECOVERY_INPUT"
          if [[ "$PUSH_MESSAGE" =~ ^Recover\ EntryFlow\ QA\ (qa-[0-9a-f]{8}-[0-9a-f]{3})$ ]]; then
            export QA_RECOVERY_ENTRY_ID="${BASH_REMATCH[1]}"
          fi
          if [[ "$PUSH_MESSAGE" =~ ^Recover\ QA\ records\ (qa-[0-9a-f]{8}-[0-9a-f]{3})\ (qa-[0-9a-f]{8}-[0-9a-f]{3})$ ]]; then
            export QA_RECOVERY_ENTRY_ID="${BASH_REMATCH[1]}"
          fi
          node smoke.mjs entryflow
      - name: Run OptiSpec smoke test
        id: optispec
        if: matrix.app == 'optispec' && !inputs.recover_entry_id
        env:
          MSUO_QA_EMAIL: ${{ secrets.OPTISPEC_QA_EMAIL }}
          MSUO_QA_PASSWORD: ${{ secrets.OPTISPEC_QA_PASSWORD }}
          QA_OPTISPEC_PENDING: ${{ inputs.optispec_pending }}
          PUSH_MESSAGE: ${{ github.event_name == 'push' && github.event.head_commit.message || '' }}
          QA_PDF_ONLY: ${{ (github.event_name == 'push' && github.event.head_commit.message != 'Verify synthetic add and remove through the dashboard' && github.event.head_commit.message != 'Start continuous Browser QA' && github.event.head_commit.message != 'Verify OptiSpec device removal end to end') || inputs.pdf_only }}
        run: |
          missing=()
          [[ -n "$MSUO_QA_EMAIL" ]] || missing+=("OPTISPEC_QA_EMAIL")
          [[ -n "$MSUO_QA_PASSWORD" ]] || missing+=("OPTISPEC_QA_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=QA credentials unavailable::GitHub Actions did not supply ${missing[*]}"
            exit 1
          fi
          if [[ "$PUSH_MESSAGE" =~ ^Recover\ QA\ records\ (qa-[0-9a-f]{8}-[0-9a-f]{3})\ (qa-[0-9a-f]{8}-[0-9a-f]{3})$ ]]; then
            export QA_RECOVERY_ENTRY_ID="${BASH_REMATCH[2]}"
          fi
          node smoke.mjs optispec

  confirm:
    name: Confirm dashboard updates in app log files
    needs: smoke
    if: always() && (needs.smoke.outputs.entryflow_windows || needs.smoke.outputs.optispec_windows)
    runs-on: [self-hosted, windows]
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify completed UpdateDashboard lifecycles
        shell: powershell
        env:
          MSUO_DEPLOY_DIR: ${{ vars.MSUO_DEPLOY_DIR }}
          ENTRYFLOW_WINDOWS: ${{ needs.smoke.outputs.entryflow_windows }}
          OPTISPEC_WINDOWS: ${{ needs.smoke.outputs.optispec_windows }}
        run: py -3 browser-qa/confirm_dashboard_updates.py

  queue-next:
    name: Queue the next continuous cycle
    needs: [plan, smoke, confirm]
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && inputs.continuous && !inputs.pdf_only && !inputs.recover_entry_id) ||
       (github.event_name == 'schedule' && needs.plan.outputs.start == 'true') ||
       (github.event_name == 'push' && github.event.head_commit.message == 'Start continuous Browser QA'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
    concurrency:
      group: browser-qa-next-cycle
      cancel-in-progress: false
    steps:
      - name: Dispatch once at five minutes or when the tests finish
        env:
          GH_TOKEN: ${{ github.token }}
          OPTISPEC_PENDING: ${{ inputs.optispec_pending }}
          OPTISPEC_ADDED: ${{ needs.smoke.outputs.optispec_added }}
          OPTISPEC_REMOVED: ${{ needs.confirm.result == 'success' && needs.smoke.outputs.optispec_removed || '' }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at')
          remaining=$(( $(date -d "$started" +%s) + 300 - $(date +%s) ))
          if (( remaining > 0 )); then sleep "$remaining"; fi

          # Ignore this run when checking for another queued or active successor.
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/browser-qa.yml/runs?event=workflow_dispatch&per_page=20" --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .display_title == \"Browser QA continuous\" and .status != \"completed\")] | length")
          if [[ "$active" != 0 ]]; then
            echo 'A continuous cycle is already queued or running.'
            exit 0
          fi

          pending=$(jq -nr --arg current "$OPTISPEC_PENDING" --arg added "$OPTISPEC_ADDED" --arg removed "$OPTISPEC_REMOVED" '
            ([$added] + ($current | split(","))) | map(select(test("^qa-[0-9a-f]{8}-[0-9a-f]{3}$") and . != $removed)) |
            reduce .[] as $id ([]; if index($id) then . else . + [$id] end) | .[:20] | join(",")')
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/browser-qa.yml/dispatches" -f ref=main -F 'inputs[continuous]=true' -f "inputs[optispec_pending]=$pending"
          echo 'Queued the next continuous Browser QA cycle.'
