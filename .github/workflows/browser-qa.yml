name: Browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-qa.yml'
      - 'browser-qa/**'
  schedule:
    - cron: '13 0,4,7,10,14,17,21 * * *'
      timezone: Europe/Vienna
    - cron: '41 1,5,8,11,15,18,22 * * *'
      timezone: Europe/Vienna

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.app }} smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(github.event_name != 'schedule' && '["entryflow","optispec"]' || github.event.schedule == '13 0,4,7,10,14,17,21 * * *' && '["entryflow"]' || '["optispec"]') }}
    concurrency:
      group: browser-qa-${{ matrix.app }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: browser-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Vary scheduled start time
        if: github.event_name == 'schedule'
        run: sleep "$((RANDOM % 481))"
      - name: Run browser smoke test
        env:
          QA_APP: ${{ matrix.app }}
          MSUO_QA_EMAIL: ${{ secrets[format('{0}_QA_EMAIL', matrix.app == 'entryflow' && 'ENTRYFLOW' || 'OPTISPEC')] }}
          MSUO_QA_PASSWORD: ${{ secrets[format('{0}_QA_PASSWORD', matrix.app == 'entryflow' && 'ENTRYFLOW' || 'OPTISPEC')] }}
        run: |
          if [[ -z "$MSUO_QA_EMAIL" || -z "$MSUO_QA_PASSWORD" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              node smoke.mjs "$QA_APP" --startup-only
              exit $?
            fi
            echo "::error::Configure ${QA_APP^^}_QA_EMAIL and ${QA_APP^^}_QA_PASSWORD in repository secrets."
            exit 1
          fi
          node smoke.mjs "$QA_APP"
