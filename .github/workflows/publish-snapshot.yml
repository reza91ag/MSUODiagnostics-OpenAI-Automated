name: Publish MSUO PDF Snapshot (GitHub Pages)

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'snapshot/**'
      - 'server.py'
      - 'pdf_export.py'
      - 'web/msuo-logo.svg'
      - '.github/workflows/publish-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: msuo-snapshot-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Overwrite Pages PDF when measurements change
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Check out Observatory source
        uses: actions/checkout@v4

      - name: Verify snapshot publisher
        shell: powershell
        run: |
          py -3 -m unittest discover -s snapshot -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot publisher tests failed' }

      - name: Publish PDF to gh-pages via GitHub API
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          py -3 snapshot/publish.py --source . --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot publishing failed' }
