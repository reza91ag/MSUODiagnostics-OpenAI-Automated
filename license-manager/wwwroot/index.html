<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSUO Community Edition Licensing</title><style>body{font-family:system-ui;background:#0f1420;color:#f3f5fa;min-height:100vh;display:grid;place-items:center;margin:0}main{width:min(460px,90vw);padding:32px;background:#1c2637;border-radius:16px}h1{font-size:1.5rem}input,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #506079}input,textarea{background:#0f1420;color:white}button{background:#345ee9;color:white;cursor:pointer;font-weight:600}button:disabled{opacity:.6}textarea{min-height:96px;overflow-wrap:anywhere}#message{min-height:24px;color:#b9cef9}#account{display:none}</style></head><body><main><h1>MSUO™ Community Edition</h1><p>Register, verify your email, and issue your license.</p><div id="auth"><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password (min. 6 characters)"><button id="register">Create account</button><button id="signin">Sign in</button><button id="reset">Reset password</button></div><div id="account"><p id="identity"></p><button id="resend">Resend verification email</button><button id="issue">Get my Community Edition license</button><textarea id="license" readonly placeholder="Your signed license appears here"></textarea><button id="copy">Copy license</button><button id="signout">Sign out</button></div><p id="message" role="status" aria-live="polite"></p></main><script type="module" src="/app.js"></script></body></html>
