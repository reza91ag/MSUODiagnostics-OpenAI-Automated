<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>MSUO Developer Preview License Registration</title><style>body{font-family:system-ui,sans-serif;background:#0f1420;color:#f3f5fa;min-height:100vh;display:grid;place-items:center;margin:0}main{width:min(460px,90vw);padding:32px;background:#1c2637;border-radius:16px;box-sizing:border-box}h1{font-size:1.45rem}input,button{box-sizing:border-box;width:100%;padding:13px;margin:9px 0;border-radius:8px;border:1px solid #506079}input{background:#101827;color:white}button{background:#345ee9;color:white;cursor:pointer;font-weight:600}button:disabled{opacity:.6}#message{min-height:24px;color:#b9cef9}</style></head><body><main><a href="/" style="color:#b9cef9">← All editions</a><h1>MSUO™ Developer Preview</h1><p>Register your email to receive your signed Developer Preview license key.</p><form id="form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"><button id="register" type="submit">Email me my license</button></form><p id="message" role="status" aria-live="polite"></p></main><script src="/app.js" defer></script></body></html>
